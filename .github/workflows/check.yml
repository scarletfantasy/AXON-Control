name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      AXON_CONTROL_SKIP_NATIVE_UI: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install display and audio dependencies
        run: python -m pip install -r requirements.txt
      - name: Check public source contents
        run: python tools/check_public_tree.py
      - name: Offline regression tests
        env:
          AXON_CONTROL_DATA_DIR: ${{ runner.temp }}\axon-control-tests
        run: python -m unittest discover -p "tests_*.py" -v
